name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0). Leave empty to read from src/core/config.py"
        required: false
        type: string
      dry-run:
        description: "Run the whole build pipeline but skip creating the GitHub release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        type: boolean
        default: false
      pre-type:
        description: "Pre-release type (empty = stable release). Sets prerelease automatically."
        required: false
        type: choice
        options:
          - ""
          - "alpha"
          - "beta"
          - "rc"
        default: ""
      hotfix:
        description: "Hotfix release (auto-increments patch, no changelog)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

# Never cancel an in-flight release, but serialize releases on the same ref.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; the publishing job elevates to contents: write.
permissions:
  contents: read

jobs:
  # =============================================================================
  # Resolve the release version from inputs / tags / src/core/config.py
  # =============================================================================
  release-info:
    name: Resolve release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      windows_version: ${{ steps.resolve.outputs.windows_version }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and release type
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PRE_TYPE: ${{ inputs['pre-type'] }}
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          version_pattern = re.compile(
              r"^v?(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)"
              r"(?P<suffix>-(?:alpha|beta|rc)(?:\.\d+)?)?$"
          )

          def parse_version(value):
              match = version_pattern.fullmatch(value.strip())
              if not match:
                  raise SystemExit(f"Invalid release version: {value!r}")
              return match

          event_name = os.environ["EVENT_NAME"]
          pre_type = os.environ.get("PRE_TYPE", "").strip()
          hotfix = os.environ.get("HOTFIX", "").lower() == "true"

          if event_name == "push":
              version = os.environ["EVENT_TAG"]
          elif hotfix:
              tags = subprocess.check_output(
                  ["git", "tag", "--list"], text=True
              ).splitlines()
              stable_tags = [
                  tag for tag in tags
                  if version_pattern.fullmatch(tag)
                  and not version_pattern.fullmatch(tag).group("suffix")
              ]
              if not stable_tags:
                  raise SystemExit("Hotfix release requires at least one stable version tag.")
              latest = max(
                  stable_tags,
                  key=lambda tag: tuple(
                      int(part) for part in version_pattern.fullmatch(tag).groups()[:3]
                  ),
              )
              match = parse_version(latest)
              version = (
                  f"{match.group('major')}.{match.group('minor')}."
                  f"{int(match.group('patch')) + 1}"
              )
          else:
              version = os.environ.get("INPUT_VERSION", "").strip()
              if not version:
                  # The canonical runtime version is defined in
                  # src/core/config.py; fall back to the other manifests for
                  # safety so a release is never mis-tagged.
                  version = None
                  candidates = (
                      ("src/core/config.py", r"""^__version__\s*=\s*["']([^"']+)["']"""),
                      ("src/__init__.py", r"""^__version__\s*=\s*["']([^"']+)["']"""),
                      ("pyproject.toml", r"""^version\s*=\s*["']([^"']+)["']"""),
                  )
                  for path, pattern in candidates:
                      source = Path(path).read_text(encoding="utf-8")
                      match = re.search(pattern, source, re.MULTILINE)
                      if match:
                          version = match.group(1)
                          print(f"Using version {version!r} from {path}")
                          break
                  if not version:
                      raise SystemExit(
                          "Could not resolve a version from src/core/config.py, "
                          "src/__init__.py or pyproject.toml."
                      )

          match = parse_version(version)
          base_version = (
              f"{match.group('major')}.{match.group('minor')}.{match.group('patch')}"
          )
          if event_name == "push":
              version = f"{base_version}{match.group('suffix') or ''}"
          elif pre_type:
              version = f"{base_version}-{pre_type}"
          else:
              version = base_version

          match = parse_version(version)
          prerelease = "true" if "-" in version else "false"
          windows_version = (
              f"{match.group('major')}.{match.group('minor')}."
              f"{match.group('patch')}.0"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version=v{version}\n")
              output.write(f"prerelease={prerelease}\n")
              output.write(f"windows_version={windows_version}\n")
          print(f"Resolved release version: v{version} (prerelease={prerelease})")
          PY

  # =============================================================================
  # Windows build - PyInstaller exe + WiX MSI installer
  # =============================================================================
  build-windows:
    name: Build Windows (${{ matrix.backend }})
    needs: release-info
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, directml]
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_WINDOWS_VERSION: ${{ needs.release-info.outputs.windows_version }}
      WINDOWS_BACKEND: ${{ matrix.backend }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-amd.txt
            pyproject.toml

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # PyInstaller must be installed explicitly; it is not in requirements.txt
          pip install pyinstaller
          if ($env:WINDOWS_BACKEND -eq "directml") {
            pip install -r requirements-amd.txt
          } else {
            # requirements.txt pins torch==2.5.1; its CUDA wheel lives on the cu124
            # index (cu128 only starts at torch 2.7 and has no 2.5.1).
            # --force-reinstall is required: requirements.txt has already installed an
            # equal-version CPU-only wheel, which pip would otherwise treat as
            # "already satisfied" and keep.
            pip install --no-cache-dir --force-reinstall torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu124
          }

      - name: Verify Windows PyTorch backend
        shell: pwsh
        run: |
          if ($env:WINDOWS_BACKEND -eq "directml") {
            python -c "import torch_directml; print(f'DirectML package loaded; devices: {torch_directml.device_count()}')"
          } else {
            python -c "import torch; assert torch.version.cuda, 'CUDA-enabled PyTorch was not installed'; print(f'CUDA PyTorch {torch.__version__} ({torch.version.cuda})')"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Build the UI
        # The app serves the compiled SPA from UI/dist, so it must exist before
        # PyInstaller packages the bundle.
        working-directory: UI
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build executable with PyInstaller (--onedir for MSI)
        # The onedir output exists only to feed heat.exe/WiX. A CUDA-enabled MSI
        # would be far past the 2 GB MSI ceiling (an MSI is COM structured
        # storage), so that backend ships split portable parts instead.
        if: env.WINDOWS_BACKEND != 'cuda'
        shell: pwsh
        run: |
          $backendArgs = @()
          if ($env:WINDOWS_BACKEND -eq "directml") {
            $backendArgs += @("--collect-all", "torch_directml", "--hidden-import", "torch_directml")
          }
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name openVideoAI `
            --icon "assets\icon\black_glass.ico" `
            --add-data "UI/dist;UI/dist" `
            --add-data "assets;assets" `
            --add-data "models.json;." `
            --collect-all src `
            --collect-all webview `
            --collect-all uvicorn `
            --collect-all fastapi `
            --hidden-import webview `
            --hidden-import webview.platforms.winforms `
            --hidden-import clr `
            @backendArgs `
            main.py

      - name: Verify onedir build exists
        if: env.WINDOWS_BACKEND != 'cuda'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\openVideoAI\openVideoAI.exe")) {
            Write-Error "dist\openVideoAI\openVideoAI.exe not found - PyInstaller onedir build failed"
            exit 1
          }
          $size = (Get-Item "dist\openVideoAI\openVideoAI.exe").Length / 1MB
          Write-Host "dist\openVideoAI\openVideoAI.exe  $([math]::Round($size,1)) MB"

      - name: Verify onedir data directories
        if: env.WINDOWS_BACKEND != 'cuda'
        shell: pwsh
        run: |
          Write-Host "=== dist\openVideoAI directory structure ==="
          Get-ChildItem "dist\openVideoAI" -Recurse -Depth 2 | Select-Object FullName, Length | Format-Table -AutoSize
          Write-Host ""
          Write-Host "=== Checking required paths ==="
          @(
            "dist\openVideoAI\_internal\UI\dist\index.html"
            "dist\openVideoAI\_internal\assets"
            "dist\openVideoAI\_internal\models.json"
            "dist\openVideoAI\_internal"
          ) | ForEach-Object {
            if (Test-Path $_) {
              Write-Host "  ✓ $_ exists"
            } else {
              Write-Host "  ✗ $_ MISSING"
            }
          }

      - name: Build portable executable (--onefile)
        shell: pwsh
        run: |
          $backendArgs = @()
          if ($env:WINDOWS_BACKEND -eq "directml") {
            $backendArgs += @("--collect-all", "torch_directml", "--hidden-import", "torch_directml")
          }
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name openVideoAI-portable `
            --icon "assets\icon\black_glass.ico" `
            --add-data "UI/dist;UI/dist" `
            --add-data "assets;assets" `
            --add-data "models.json;." `
            --collect-all src `
            --collect-all webview `
            --collect-all uvicorn `
            --collect-all fastapi `
            --hidden-import webview `
            --hidden-import webview.platforms.winforms `
            --hidden-import clr `
            @backendArgs `
            main.py

      - name: Verify portable executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\openVideoAI-portable.exe")) {
            Write-Error "dist\openVideoAI-portable.exe not found - PyInstaller onefile build failed"
            exit 1
          }
          $size = (Get-Item "dist\openVideoAI-portable.exe").Length / 1MB
          Write-Host "dist\openVideoAI-portable.exe  $([math]::Round($size,1)) MB"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $backendSuffix = if ($env:WINDOWS_BACKEND -eq "cuda") { "" } else { "-$env:WINDOWS_BACKEND" }
          $zip = "openVideoAI-windows-x64$backendSuffix-portable.zip"
          # Compress-Archive cannot stream a single entry larger than 2 GiB and
          # dies with "Exception calling Write with 3 arguments: Stream was too
          # long"; the CUDA-enabled onefile (~2.5 GB) hits exactly that. The tar
          # bundled with Windows is bsdtar, which writes such zips fine. Call it
          # by absolute path so Git's GNU tar cannot shadow it (GNU tar would
          # silently store a tar archive under a .zip name).
          & "$env:SystemRoot\System32\tar.exe" -a -c -f $zip -C dist openVideoAI-portable.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $size = (Get-Item $zip).Length / 1MB
          Write-Host "$zip  $([math]::Round($size,1)) MB"

      - name: Split oversized portable ZIP
        # GitHub rejects release assets of 2 GiB or more and the CUDA-enabled
        # portable is ~2.5 GiB. Chunks are named exactly like the Linux legs
        # (`split -b 1900M`), so reassembly is the same on every platform:
        #   cmd:   copy /b <name>.part-* portable.zip
        #   POSIX: cat <name>.part-* > portable.zip
        shell: pwsh
        run: |
          $backendSuffix = if ($env:WINDOWS_BACKEND -eq "cuda") { "" } else { "-$env:WINDOWS_BACKEND" }
          $zip = "openVideoAI-windows-x64$backendSuffix-portable.zip"
          $limit = 1900MB
          if ((Get-Item $zip).Length -le $limit) {
            Write-Host "$zip is below the $([math]::Round($limit / 1MB)) MB chunk limit - keeping it whole."
            exit 0
          }

          $buffer = New-Object byte[] (8MB)
          $source = [System.IO.File]::OpenRead($zip)
          try {
            $index = 0
            while ($source.Position -lt $source.Length) {
              $suffix = [string][char](97 + [int][math]::Floor($index / 26)) + [string][char](97 + ($index % 26))
              $part = "$($zip).part-$suffix"
              $target = [System.IO.File]::Create($part)
              try {
                $remaining = [long]$limit
                while ($remaining -gt 0) {
                  $read = $source.Read($buffer, 0, [int][Math]::Min([long]$buffer.Length, $remaining))
                  if ($read -le 0) { break }
                  $target.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              } finally { $target.Dispose() }
              Write-Host "  $part  $([math]::Round((Get-Item $part).Length / 1MB,1)) MB"
              $index++
            }
          } finally { $source.Dispose() }

          # Drop the whole archive: it is past the release-asset limit and would
          # double the upload - the parts already carry every byte.
          Remove-Item $zip

      - name: Install WiX Toolset 3
        if: env.WINDOWS_BACKEND != 'cuda'
        shell: pwsh
        run: |
          # The Windows runner image already ships WiX 3, so pinning an older
          # version via Chocolatey makes it exit non-zero with "a newer version
          # is already installed". Only install when WiX is genuinely missing,
          # and never fail just because Chocolatey had nothing to do.
          function Get-WixBin {
            $base = "${env:ProgramFiles(x86)}"
            $pinned = Join-Path $base "WiX Toolset v3.14\bin"
            if (Test-Path $pinned) { return $pinned }
            # Chocolatey sometimes installs a slightly different sub-path
            $found = Get-ChildItem "$base\WiX Toolset*\bin" -Directory -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { return $found.FullName }
            return $null
          }

          $wixBin = Get-WixBin
          if (-not $wixBin) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $global:LASTEXITCODE = 0
            $wixBin = Get-WixBin
          }

          if (-not $wixBin) { Write-Error "WiX bin directory not found"; exit 1 }
          Write-Host "WiX bin: $wixBin"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Write WiX source file
        if: env.WINDOWS_BACKEND != 'cuda'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null

          # Read template and substitute version
          $wxs = Get-Content -Path .github\wix\openVideoAI.wxs.template -Raw
          $wxs = $wxs.Replace("__WINDOWS_VERSION__", $env:RELEASE_WINDOWS_VERSION)
          $wxs | Set-Content -Path build\openVideoAI.wxs -Encoding UTF8

      - name: Harvest application files (heat)
        if: env.WINDOWS_BACKEND != 'cuda'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build\wixobj -Force | Out-Null
          # Harvest the entire PyInstaller onedir output into a component group.
          # A single WiX <File> element installs one file only, so directory
          # payloads (_internal, UI, assets, ...) must be harvested like this.
          heat.exe dir "dist\openVideoAI" `
            -cg AppFiles `
            -gg -g1 `
            -srd `
            -dr INSTALLFOLDER `
            -var var.AppSourceDir `
            -out build\AppFiles.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile WiX source (candle)
        if: env.WINDOWS_BACKEND != 'cuda'
        shell: pwsh
        run: |
          # Use an absolute source root so the harvested Source paths resolve
          # regardless of candle's working directory.
          $appDir = (Resolve-Path "dist\openVideoAI").Path
          candle.exe `
            -dAppSourceDir="$appDir" `
            -out build\wixobj\ `
            build\openVideoAI.wxs build\AppFiles.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Link WiX object (light)
        if: env.WINDOWS_BACKEND != 'cuda'
        shell: pwsh
        run: |
          $backendSuffix = if ($env:WINDOWS_BACKEND -eq "cuda") { "" } else { "-$env:WINDOWS_BACKEND" }
          # -sval skips ICE validation; per-user installs with harvested file
          # key paths (ICE38/ICE64) would otherwise fail the link step.
          light.exe `
            -sval `
            -out "openVideoAI-windows-x64$backendSuffix.msi" `
            build\wixobj\openVideoAI.wixobj build\wixobj\AppFiles.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openVideoAI-windows-${{ matrix.backend }}
          if-no-files-found: error
          retention-days: 7
          path: |
            openVideoAI-windows-x64*.msi
            openVideoAI-windows-x64*-portable.zip
            openVideoAI-windows-x64*-portable.zip.part-*

  # =============================================================================
  # Linux build
  # =============================================================================
  build-linux:
    name: Build Linux (${{ matrix.backend }})
    needs: release-info
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, rocm, xpu]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LINUX_BACKEND: ${{ matrix.backend }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install system dependencies for pywebview
        run: |
          sudo apt-get update -qq
          # Ubuntu 24.04 renamed the WebKitGTK packages from 4.0 to 4.1
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          case "${LINUX_BACKEND}" in
            cuda)
              # requirements.txt pins torch==2.5.1; its CUDA wheel lives on the cu124
              # index (cu128 only starts at torch 2.7 and has no 2.5.1).
              # --force-reinstall keeps the installed wheel identical to the pin
              # instead of silently reusing whatever PyPI resolved.
              pip install --no-cache-dir --force-reinstall torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cu124
              ;;
            rocm)
              # Use latest from ROCm 6.4 index (2.5.1 lacks ROCm 6.4 support)
              pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/rocm6.4
              ;;
            xpu)
              # Use latest from XPU index
              pip install --upgrade torch torchvision --index-url https://download.pytorch.org/whl/xpu
              ;;
          esac

      - name: Verify Linux PyTorch backend
        run: |
          python - <<'PY'
          import os
          import torch

          backend = os.environ["LINUX_BACKEND"]
          if backend == "cuda" and not torch.version.cuda:
              raise SystemExit("CUDA-enabled PyTorch was not installed")
          if backend == "rocm" and not torch.version.hip:
              raise SystemExit("ROCm-enabled PyTorch was not installed")
          if backend == "xpu" and not getattr(torch.version, "xpu", None):
              raise SystemExit("Intel XPU-enabled PyTorch was not installed")
          print(f"PyTorch {torch.__version__} backend check passed for {backend}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Build the UI
        # The app serves the compiled SPA from UI/dist, so it must exist before
        # PyInstaller packages the bundle.
        working-directory: UI
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build executable with PyInstaller
        run: |
          # PyInstaller's CArchive table of contents stores 32-bit offsets, so a
          # onefile payload larger than 4 GiB cannot be assembled ("'I' format
          # requires 0 <= number <= 4294967295"). The ROCm runtime alone exceeds
          # that, hence onedir for that backend. The tar + split packaging steps
          # below work the same for a directory as for a single file.
          ONEFILE_FLAG="--onefile"
          if [[ "$LINUX_BACKEND" == "rocm" ]]; then
            ONEFILE_FLAG=""
          fi
          python -m PyInstaller \
            --noconfirm \
            --clean \
            $ONEFILE_FLAG \
            --name openVideoAI \
            --add-data "UI/dist:UI/dist" \
            --add-data "assets:assets" \
            --add-data "models.json:." \
            --collect-all src \
            --collect-all webview \
            --collect-all uvicorn \
            --collect-all fastapi \
            --hidden-import webview \
            main.py

      - name: Package tarball
        run: |
          suffix="-$LINUX_BACKEND"
          if [[ "$LINUX_BACKEND" == "cuda" ]]; then
            suffix=""
          fi
          archive="openVideoAI-linux-x64${suffix}.tar.gz"
          tar -czf "$archive" -C dist openVideoAI

      - name: Split tarball for GitHub release limits
        run: |
          # GitHub Releases reject any single asset >= 2 GiB (2147483648 bytes).
          # Accelerator-enabled PyTorch bundles may exceed this limit.
          suffix="-$LINUX_BACKEND"
          if [[ "$LINUX_BACKEND" == "cuda" ]]; then
            suffix=""
          fi
          archive="openVideoAI-linux-x64${suffix}.tar.gz"
          split -b 1900M "$archive" "${archive}.part-"
          ls -l "${archive}.part-"*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openVideoAI-linux-${{ matrix.backend }}
          if-no-files-found: error
          retention-days: 7
          path: openVideoAI-linux-x64*.tar.gz.part-*

  # =============================================================================
  # macOS build
  # =============================================================================
  build-macos:
    name: Build macOS Apple Silicon (Metal)
    needs: release-info
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          # Pin to specific version for macOS Metal/MPS support
          pip install torch==2.5.1 torchvision==0.20.1
          python - <<'PY'
          import platform
          import torch

          if platform.machine() != "arm64":
              raise SystemExit("Apple Silicon runner required for the Metal release build")
          if not torch.backends.mps.is_built():
              raise SystemExit("Installed PyTorch does not include Metal/MPS support")
          print(f"PyTorch {torch.__version__} Metal/MPS build verified")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Build the UI
        # The app serves the compiled SPA from UI/dist, so it must exist before
        # PyInstaller packages the bundle.
        working-directory: UI
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build app bundle with PyInstaller
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onefile \
            --name openVideoAI \
            --add-data "UI/dist:UI/dist" \
            --add-data "assets:assets" \
            --add-data "models.json:." \
            --collect-all src \
            --collect-all webview \
            --collect-all uvicorn \
            --collect-all fastapi \
            --hidden-import webview \
            main.py

      - name: Package DMG and ZIP
        run: |
          # Detach any stale mounted volumes for this app
          hdiutil detach "/Volumes/openVideoAI" -quiet 2>/dev/null || true
          hdiutil create \
            -volname "openVideoAI" \
            -srcfolder "dist/openVideoAI.app" \
            -ov -format UDZO \
            "openVideoAI-macos.dmg"
          ditto -c -k --keepParent "dist/openVideoAI.app" "openVideoAI-macos.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openVideoAI-macos-arm64-metal
          if-no-files-found: error
          retention-days: 7
          path: |
            openVideoAI-macos.dmg
            openVideoAI-macos.zip

  # =============================================================================
  # Publish GitHub release
  # =============================================================================
  release:
    name: Publish release
    needs: [release-info, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history and tags are needed to diff against the previous release.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install OpenCode CLI (best effort)
        # The generator falls back to Mistral/local when OpenCode is unavailable.
        continue-on-error: true
        run: npm install --global @opencode/cli

      - name: Install and configure Ollama for local AI (no API key)
        # Primary provider: local Ollama model (qwen2.5-coder:7b). No authentication needed.
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5-coder:7b

      - name: Configure OpenCode for Ollama
        continue-on-error: true
        run: |
          mkdir -p ~/.opencode
          cat > ~/.opencode/config.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "provider": {
              "ollama": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Ollama",
                "options": { "baseURL": "http://localhost:11434/v1" },
                "models": {
                  "qwen2.5-coder:7b": { "name": "Qwen2.5 Coder 7B" }
                }
              }
            },
            "model": "ollama/qwen2.5-coder:7b"
          }
          EOF

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -Rl release-artifacts

      - name: Generate and verify SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          for file in release-artifacts/openVideoAI-*; do
            [[ -f "$file" && "$file" != *.sha256 ]] || continue
            (cd release-artifacts && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done
          checksum_files=(release-artifacts/*.sha256)
          if ((${#checksum_files[@]} == 0)); then
            echo "No release artifacts found to checksum."
            exit 1
          fi
          (cd release-artifacts && sha256sum -c ./*.sha256)

      - name: Generate release notes
        env:
          # Primary provider: OpenCode CLI with local Ollama (qwen2.5-coder:7b).
          # No API key needed. Configured in "Configure OpenCode for Ollama" step.
          OPENCODE_MODEL: ollama/qwen2.5-coder:7b
          OPENCODE_RUN_ARGS: ${{ vars.OPENCODE_RUN_ARGS }}
          # Fallback provider: Mistral (set MISTRAL_API_KEY secret to enable).
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          # Fallback provider: Puter AI (free Python package, no API key needed).
          PUTER_MODEL: gpt-4o-mini
          # Final fallback: local commit summarization (always works, no AI).
        run: |
          pip install puter
          python scripts/generate_release_notes.py \
            --version "${{ needs.release-info.outputs.version }}" \
            --output RELEASE_NOTES.md

      - name: Create GitHub release
        if: github.event_name != 'workflow_dispatch' || inputs['dry-run'] != true
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/openVideoAI-windows-x64*.msi
            release-artifacts/openVideoAI-windows-x64*-portable.zip
            release-artifacts/openVideoAI-windows-x64*-portable.zip.part-*
            release-artifacts/openVideoAI-linux-x64*.tar.gz.part-*
            release-artifacts/openVideoAI-macos.dmg
            release-artifacts/openVideoAI-macos.zip
            release-artifacts/*.sha256
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ needs.release-info.outputs.prerelease }}
          tag_name: ${{ needs.release-info.outputs.version }}
          # Everything above stays under GitHub's 2 GiB per-asset limit: the
          # Linux tarballs, and an oversized Windows portable, ship as .part-*
          # chunks. The CUDA Windows leg has no MSI because an MSI is COM
          # structured storage and cannot grow past 2 GB.
          body_path: RELEASE_NOTES.md
