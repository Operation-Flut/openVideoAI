name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0). Leave empty to read from src/__init__.py"
        required: false
        type: string
      dry-run:
        description: "Run the whole build pipeline but skip creating the GitHub release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        type: boolean
        default: false
      pre-type:
        description: "Pre-release type (empty = stable release). Sets prerelease automatically."
        required: false
        type: choice
        options:
          - ""
          - "alpha"
          - "beta"
          - "rc"
        default: ""
      hotfix:
        description: "Hotfix release (auto-increments patch, no changelog)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # =============================================================================
  # Resolve the release version from inputs / tags / src/__init__.py
  # =============================================================================
  release-info:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      windows_version: ${{ steps.resolve.outputs.windows_version }}
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and release type
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PRE_TYPE: ${{ inputs['pre-type'] }}
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          version_pattern = re.compile(
              r"^v?(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)"
              r"(?P<suffix>-(?:alpha|beta|rc)(?:\.\d+)?)?$"
          )

          def parse_version(value):
              match = version_pattern.fullmatch(value.strip())
              if not match:
                  raise SystemExit(f"Invalid release version: {value!r}")
              return match

          event_name = os.environ["EVENT_NAME"]
          pre_type = os.environ.get("PRE_TYPE", "").strip()
          hotfix = os.environ.get("HOTFIX", "").lower() == "true"

          if event_name == "push":
              version = os.environ["EVENT_TAG"]
          elif hotfix:
              tags = subprocess.check_output(
                  ["git", "tag", "--list"], text=True
              ).splitlines()
              stable_tags = [
                  tag for tag in tags
                  if version_pattern.fullmatch(tag)
                  and not version_pattern.fullmatch(tag).group("suffix")
              ]
              if not stable_tags:
                  raise SystemExit("Hotfix release requires at least one stable version tag.")
              latest = max(
                  stable_tags,
                  key=lambda tag: tuple(
                      int(part) for part in version_pattern.fullmatch(tag).groups()[:3]
                  ),
              )
              match = parse_version(latest)
              version = (
                  f"{match.group('major')}.{match.group('minor')}."
                  f"{int(match.group('patch')) + 1}"
              )
          else:
              version = os.environ.get("INPUT_VERSION", "").strip()
              if not version:
                  init_source = Path("src/__init__.py").read_text(encoding="utf-8")
                  match = re.search(
                      r"""^__version__\s*=\s*["']([^"']+)["']""",
                      init_source,
                      re.MULTILINE,
                  )
                  if not match:
                      raise SystemExit("Could not find __version__ in src/__init__.py.")
                  version = match.group(1)

          match = parse_version(version)
          base_version = (
              f"{match.group('major')}.{match.group('minor')}.{match.group('patch')}"
          )
          if event_name == "push":
              version = f"{base_version}{match.group('suffix') or ''}"
          elif pre_type:
              version = f"{base_version}-{pre_type}"
          else:
              version = base_version

          match = parse_version(version)
          prerelease = "true" if "-" in version else "false"
          windows_version = (
              f"{match.group('major')}.{match.group('minor')}."
              f"{match.group('patch')}.0"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version=v{version}\n")
              output.write(f"prerelease={prerelease}\n")
              output.write(f"windows_version={windows_version}\n")
          print(f"Resolved release version: v{version} (prerelease={prerelease})")
          PY

  # =============================================================================
  # Windows build - PyInstaller exe + WiX MSI installer
  # =============================================================================
  build-windows:
    name: Build Windows
    needs: release-info
    runs-on: windows-latest
    env:
      RELEASE_WINDOWS_VERSION: ${{ needs.release-info.outputs.windows_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # PyInstaller must be installed explicitly; it is not in requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --noconsole `
            --onefile `
            --name openVideoAI `
            --icon "assets\icon\black_glass.ico" `
            --add-data "UI;UI" `
            --add-data "assets;assets" `
            --add-data "models.json;." `
            --collect-all src `
            --collect-all webview `
            --collect-all uvicorn `
            --collect-all fastapi `
            --hidden-import webview `
            --hidden-import webview.platforms.winforms `
            --hidden-import clr `
            main.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\openVideoAI.exe")) {
            Write-Error "dist\openVideoAI.exe not found - PyInstaller build failed"
            exit 1
          }
          $size = (Get-Item "dist\openVideoAI.exe").Length / 1MB
          Write-Host "dist\openVideoAI.exe  $([math]::Round($size,1)) MB"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\openVideoAI.exe `
                           -DestinationPath openVideoAI-windows-x64-portable.zip `
                           -Force

      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          # The Windows runner image already ships WiX 3, so pinning an older
          # version via Chocolatey makes it exit non-zero with "a newer version
          # is already installed". Only install when WiX is genuinely missing,
          # and never fail just because Chocolatey had nothing to do.
          function Get-WixBin {
            $base = "${env:ProgramFiles(x86)}"
            $pinned = Join-Path $base "WiX Toolset v3.14\bin"
            if (Test-Path $pinned) { return $pinned }
            # Chocolatey sometimes installs a slightly different sub-path
            $found = Get-ChildItem "$base\WiX Toolset*\bin" -Directory -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($found) { return $found.FullName }
            return $null
          }

          $wixBin = Get-WixBin
          if (-not $wixBin) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $global:LASTEXITCODE = 0
            $wixBin = Get-WixBin
          }

          if (-not $wixBin) { Write-Error "WiX bin directory not found"; exit 1 }
          Write-Host "WiX bin: $wixBin"
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Write WiX source file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null

          # The WXS is written as a here-string so all special characters are
          # literal. Version and paths are substituted via PowerShell after.
          $wxs = @'
          <?xml version="1.0" encoding="UTF-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">

            <Product
              Id="*"
              Name="openVideoAI"
              Language="1033"
              Version="__WINDOWS_VERSION__"
              Manufacturer="openVideoAI"
              UpgradeCode="{F32A90F9-E651-4D75-A1B6-717F7F5DAD7E}">

              <Package
                InstallerVersion="500"
                Compressed="yes"
                InstallScope="perUser"
                Comments="openVideoAI - Local AI Video Enhancement" />

              <!-- Always upgrade: remove any older installed version first -->
              <MajorUpgrade
                DowngradeErrorMessage="A newer version of openVideoAI is already installed." />

              <MediaTemplate EmbedCab="yes" />

              <!-- == Directory layout ====================================== -->
              <Directory Id="TARGETDIR" Name="SourceDir">

                <!-- Install to %LocalAppData%\Programs\openVideoAI (perUser) -->
                <Directory Id="LocalAppDataFolder">
                  <Directory Id="ProgramsFolder" Name="Programs">
                    <Directory Id="INSTALLFOLDER" Name="openVideoAI" />
                  </Directory>
                </Directory>

                <!-- Start Menu shortcut lives under the user's Programs folder -->
                <Directory Id="ProgramMenuFolder">
                  <Directory Id="ApplicationProgramsFolder" Name="openVideoAI" />
                </Directory>

                <!-- Desktop shortcut -->
                <Directory Id="DesktopFolder" Name="Desktop" />

              </Directory>

              <!-- == Components =========================================== -->
              <ComponentGroup Id="ProductComponents" Directory="INSTALLFOLDER">

                <!-- Main executable -->
                <Component Id="AppExecutable"
                           Guid="{84E48F28-1F68-4CC8-9512-8E7AB32D79B3}">
                  <File Id="OpenVideoAIExe"
                        Source="dist\openVideoAI.exe" />
                  <!-- Per-user install: the component key path must be an HKCU
                       registry value (ICE38), and every directory created in
                       the user profile must be scheduled for removal (ICE64). -->
                  <RemoveFolder Id="CleanupInstallFolder"
                                Directory="INSTALLFOLDER"
                                On="uninstall" />
                  <RemoveFolder Id="CleanupProgramsFolder"
                                Directory="ProgramsFolder"
                                On="uninstall" />
                  <RegistryValue Root="HKCU"
                                 Key="Software\openVideoAI"
                                 Name="AppInstalled"
                                 Type="integer"
                                 Value="1"
                                 KeyPath="yes" />
                </Component>

              </ComponentGroup>

              <!-- Start Menu shortcut -->
              <DirectoryRef Id="ApplicationProgramsFolder">
                <Component Id="StartMenuShortcut"
                           Guid="{2C5A1B9E-4F3D-4E8A-B7C6-91D2E5F0A384}">
                  <Shortcut Id="StartMenuShortcutLink"
                            Name="openVideoAI"
                            Description="Local AI Video Enhancement"
                            Target="[INSTALLFOLDER]openVideoAI.exe"
                            WorkingDirectory="INSTALLFOLDER"
                            Icon="AppIcon" />
                  <RemoveFolder Id="CleanupStartMenu"
                                Directory="ApplicationProgramsFolder"
                                On="uninstall" />
                  <RegistryValue Root="HKCU"
                                 Key="Software\openVideoAI"
                                 Name="StartMenuInstalled"
                                 Type="integer"
                                 Value="1"
                                 KeyPath="yes" />
                </Component>
              </DirectoryRef>

              <!-- Desktop shortcut -->
              <DirectoryRef Id="DesktopFolder">
                <Component Id="DesktopShortcut"
                           Guid="{7E4B2F1A-8D5C-4A9B-B3E6-C2D1F8A09357}">
                  <Shortcut Id="DesktopShortcutLink"
                            Name="openVideoAI"
                            Description="Local AI Video Enhancement"
                            Target="[INSTALLFOLDER]openVideoAI.exe"
                            WorkingDirectory="INSTALLFOLDER"
                            Icon="AppIcon" />
                  <RegistryValue Root="HKCU"
                                 Key="Software\openVideoAI"
                                 Name="DesktopInstalled"
                                 Type="integer"
                                 Value="1"
                                 KeyPath="yes" />
                </Component>
              </DirectoryRef>

              <!-- Application icon (used by shortcuts) -->
              <Icon Id="AppIcon" SourceFile="assets\icon\black_glass.ico" />

              <!-- Add/Remove Programs entry -->
              <Property Id="ARPPRODUCTICON" Value="AppIcon" />
              <Property Id="ARPHELPLINK" Value="https://github.com/openVideoAI/openVideoAI" />

              <!-- == Features ============================================= -->
              <Feature Id="MainFeature" Title="openVideoAI" Level="1">
                <ComponentGroupRef Id="ProductComponents" />
                <ComponentRef Id="StartMenuShortcut" />
                <ComponentRef Id="DesktopShortcut" />
              </Feature>

            </Product>
          </Wix>
          '@

          $wxs = $wxs.Replace("__WINDOWS_VERSION__", $env:RELEASE_WINDOWS_VERSION)
          $wxs | Set-Content -Path build\openVideoAI.wxs -Encoding UTF8

      - name: Compile WiX source (candle)
        shell: pwsh
        run: |
          candle.exe build\openVideoAI.wxs -out build\openVideoAI.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Link WiX object (light)
        shell: pwsh
        run: |
          light.exe build\openVideoAI.wixobj -out openVideoAI-windows-x64.msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openVideoAI-windows
          path: |
            openVideoAI-windows-x64.msi
            openVideoAI-windows-x64-portable.zip

  # =============================================================================
  # Linux build
  # =============================================================================
  build-linux:
    name: Build Linux
    needs: release-info
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies for pywebview
        run: |
          sudo apt-get update -qq
          # Ubuntu 24.04 renamed the WebKitGTK packages from 4.0 to 4.1
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name openVideoAI \
            --add-data "UI:UI" \
            --add-data "assets:assets" \
            --add-data "models.json:." \
            --collect-all src \
            --collect-all webview \
            --collect-all uvicorn \
            --collect-all fastapi \
            --hidden-import webview \
            main.py

      - name: Package tarball
        run: tar -czf openVideoAI-linux-x64.tar.gz -C dist openVideoAI

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openVideoAI-linux
          path: openVideoAI-linux-x64.tar.gz

  # =============================================================================
  # macOS build
  # =============================================================================
  build-macos:
    name: Build macOS
    needs: release-info
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app bundle with PyInstaller
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --onefile \
            --name openVideoAI \
            --add-data "UI:UI" \
            --add-data "assets:assets" \
            --add-data "models.json:." \
            --collect-all src \
            --collect-all webview \
            --collect-all uvicorn \
            --collect-all fastapi \
            --hidden-import webview \
            main.py

      - name: Package DMG and ZIP
        run: |
          hdiutil create \
            -volname "openVideoAI" \
            -srcfolder "dist/openVideoAI.app" \
            -ov -format UDZO \
            "openVideoAI-macos.dmg"
          ditto -c -k --keepParent "dist/openVideoAI.app" "openVideoAI-macos.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openVideoAI-macos
          path: |
            openVideoAI-macos.dmg
            openVideoAI-macos.zip

  # =============================================================================
  # Publish GitHub release
  # =============================================================================
  release:
    name: Publish release
    needs: [release-info, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -Rl release-artifacts

      - name: Create GitHub release
        if: github.event_name != 'workflow_dispatch' || inputs['dry-run'] != true
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/openVideoAI-windows-x64.msi
            release-artifacts/openVideoAI-windows-x64-portable.zip
            release-artifacts/openVideoAI-linux-x64.tar.gz
            release-artifacts/openVideoAI-macos.dmg
            release-artifacts/openVideoAI-macos.zip
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ needs.release-info.outputs.prerelease }}
          tag_name: ${{ needs.release-info.outputs.version }}
