name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-multipart

      - name: Run smoke check
        shell: bash
        run: |
          # Headless runners have no GUI backend, so run the API-only mode and
          # probe the HTTP endpoint instead of opening a desktop window.
          python main.py --mode server --port 8000 &
          SERVER_PID=$!

          ready=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/status >/dev/null 2>&1; then
              ready="1"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Server process exited before becoming ready" >&2
              exit 1
            fi
            sleep 1
          done

          if [ -z "$ready" ]; then
            echo "Server did not respond within 60s" >&2
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          echo "Health check response:"
          curl -fsS http://127.0.0.1:8000/api/status

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

      - name: Compile project
        run: |
          python -m compileall src main.py
