[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openvideoai"
version = "0.3.0-beta"
description = "Local AI Video Enhancement Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "openVideoAI Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "basicsr @ git+https://github.com/XPixelGroup/BasicSR.git@8d56e3a045f9fb3e1d8872f92ee4a4f07f886b0a",
    "realesrgan",
    "opencv-python",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "fastapi>=0.142.4",
    "python-multipart>=0.0.6",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "requests>=2.34.2",
    "psutil>=7.2.2",
    "pywebview>=6.2.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
tensorrt = ["tensorrt>=8.6.0"]
onnx = ["onnxruntime>=1.18.0"]
ffmpeg = ["ffmpeg-python>=0.2.0"]

[project.entry-points]
console_scripts = [
    "openvideoai = src.cli.main:app",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "W", "C4", "C9", "C90", "C99", "Q", "T20", "TID", "TRY", "SIM", "ANN", "ARG", "PTH", "ERA", "PL", "RET", "PERF", "NPY", "TCH", "ICN", "PIC", "DTZ", "FUR", "LOG", "N", "FA", "INP", "ISC", "RSE", "RUF", "SLF", "SLOT", "T10", "UP"]
ignore = ["E501", "ANN001", "ANN002", "ANN003", "ARG001", "ARG002", "PTH118", "PTH123", "TRY003", "SIM102", "SIM103", "SIM115", "TID252", "TCH001", "TCH002", "TCH003", "C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_reexport = true
namespace_packages = true
allow_untyped_globals = false
allow_untyped_calls = false
allow_untyped_decorators = false
check_unused_exports = true

[[tool.mypy.overrides]]
module = "src.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]